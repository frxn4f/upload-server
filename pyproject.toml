[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upload-server"
version = "1.0"
description = "Servidor HTTP ligero para transferir archivos entre máquinas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/frxn4f/upload-server"

[project.scripts]
upload-server = "upload_server:main"

[tool.setuptools]
py-modules = ["upload_server"]
